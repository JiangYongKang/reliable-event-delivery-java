spring.application.name=reliable-event-delivery
server.port=18080

# 投递子系统配置
delivery.store-path=data/event-store.json
delivery.max-attempts=5
delivery.backoff-base=200ms
delivery.backoff-max=10s
delivery.lease-duration=5s
delivery.poll-interval=100ms
delivery.delivery-timeout=2s
delivery.max-pending=10000
delivery.workers=4
delivery.loopback-base-url=http://127.0.0.1:18080

# 本地验证用租户令牌（仅本地环境；生产环境应走外部注入）
delivery.tenant-tokens.token-tenant-a=tenant-a
delivery.tenant-tokens.token-tenant-b=tenant-b

logging.level.com.github.highcumontoa.delivery=INFO
