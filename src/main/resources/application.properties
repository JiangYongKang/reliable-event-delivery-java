spring.application.name=reliable-event-delivery
server.port=8080

delivery.storage-dir=target/event-store
delivery.worker-count=2
delivery.lease-duration=10s
delivery.delivery-timeout=2s
delivery.retry-base-backoff=200ms
delivery.max-attempts=5
delivery.max-pending=10000
delivery.claim-batch-size=32
delivery.poll-interval=100ms
delivery.gate-max-backlog=1000
delivery.gate-overflow-policy=REJECT
delivery.gate-defer-timeout=5s
